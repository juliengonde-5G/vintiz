[project]
name = "vintiz-api"
version = "1.1.0"
description = "Vintiz - Boutique Management API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "email-validator>=2.0.0",
    "PyJWT>=2.8.0",
    "bcrypt>=4.1.0",
    "python-multipart>=0.0.9",
    "pillow>=10.0.0",
    "python-barcode>=0.15.1",
    "qrcode>=7.4.0",
    "cryptography>=42.0.0",
    "anthropic>=0.40.0",
    "httpx>=0.27.0",
    "tenacity>=8.2.0",
    "redis>=5.0.0",
    "apscheduler>=3.10.0",
    "pgvector>=0.3.0",
    "reportlab>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.8.0",
    "aiosqlite>=0.20.0",
    "pip-audit>=2.10.1",
]
# Offline background-removal fallback for storefront photos. Heavy (onnxruntime
# + numba/scipy stack) — install only where the local cutout is wanted:
# ``pip install -e ".[rembg]"``. The default backend is Photoroom
# (PHOTOROOM_API_KEY, dependency-free); the code imports rembg lazily and
# degrades to "skipped" when this extra isn't installed.
rembg = ["rembg>=2.0.50", "onnxruntime>=1.16.0"]
# Real visual embedding (CLIP/SigLIP) for the Personal Shopper (PS 360 V4).
# Heavy (onnxruntime + Pillow). Install only where VISUAL_EMBEDDING_BACKEND=clip
# is wanted: ``pip install -e ".[clip]"`` + set CLIP_MODEL_PATH. The encoder
# imports onnxruntime lazily and falls back to the structured encoder when the
# dep/model is missing, so it's safe to ship without this extra installed.
clip = ["onnxruntime>=1.16.0", "Pillow>=10.0.0"]

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

# The repo is a flat layout: ``app`` is the importable package, while
# ``alembic`` / ``prompts`` / ``tests`` (and the runtime ``uploads`` dir) sit
# alongside it. Without this, setuptools auto-discovery aborts the editable
# install with "Multiple top-level packages discovered in a flat-layout".
[tool.setuptools.packages.find]
include = ["app*"]
