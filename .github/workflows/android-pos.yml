name: Android POS

# CI dédié à l'app POS staff (fr.vintiz.pos / :app-pos).
# Voir docs/MIGRATION_ANDROID_NATIVE.md.

on:
  push:
    branches: [main]
    paths:
      - "apps/android/**"
      - ".github/workflows/android-pos.yml"
  pull_request:
    paths:
      - "apps/android/**"
      - ".github/workflows/android-pos.yml"

concurrency:
  group: android-pos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint + tests + assemble :app-pos
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platforms;android-35
            build-tools;35.0.0

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/android/**/*.gradle*', 'apps/android/**/gradle-wrapper.properties', 'apps/android/gradle/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Lint :app-pos
        run: gradle :app-pos:lintDevDebug --no-daemon --stacktrace

      - name: Unit tests (core + data + feature reused by POS)
        run: gradle testDevDebugUnitTest --no-daemon --stacktrace

      - name: Assemble :app-pos debug APK
        run: gradle :app-pos:assembleDevDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vintiz-pos-dev-debug
          path: apps/android/app-pos/build/outputs/apk/dev/debug/*.apk
          retention-days: 7
