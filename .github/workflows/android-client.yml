name: Android Client

# CI dédié à l'app cliente B2C (fr.vintiz.client / :app-client).
# Voir docs/PLAN_ANDROID_CLIENT_APP.md.

on:
  push:
    branches: [main]
    paths:
      - "apps/android/**"
      - ".github/workflows/android-client.yml"
  pull_request:
    paths:
      - "apps/android/**"
      - ".github/workflows/android-client.yml"

concurrency:
  group: android-client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint + tests + assemble :app-client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platforms;android-35
            build-tools;35.0.0

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/android/**/*.gradle*', 'apps/android/**/gradle-wrapper.properties', 'apps/android/gradle/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Lint :app-client
        run: gradle :app-client:lintDevDebug --no-daemon --stacktrace

      - name: Unit tests (data-auth-client + feature client modules)
        run: gradle :data:data-auth-client:testDebugUnitTest :feature:feature-client-onboarding:testDebugUnitTest :feature:feature-client-shell:testDebugUnitTest --no-daemon --stacktrace

      - name: Assemble :app-client debug APK
        run: gradle :app-client:assembleDevDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vintiz-client-dev-debug
          path: apps/android/app-client/build/outputs/apk/dev/debug/*.apk
          retention-days: 7
