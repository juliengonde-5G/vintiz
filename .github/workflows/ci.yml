name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # -------------------------------------------------------
  # API — lint + tests Python
  # -------------------------------------------------------
  api:
    name: API (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    services:
      postgres:
        # Même image qu'en prod (docker-compose.prod.yml) : embarque
        # l'extension pgvector, requise par la migration 0008
        # (CREATE EXTENSION vector + colonnes VECTOR). postgres:16-alpine ne
        # l'a pas → « type vector does not exist » à l'upgrade Alembic.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: vintiz_test
          POSTGRES_PASSWORD: vintiz_test
          POSTGRES_DB: vintiz_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://vintiz_test:vintiz_test@localhost:5432/vintiz_test
      SECRET_KEY: ci-secret-key-not-used-in-prod-00000000
      FISCAL_SIGNING_KEY: ci-fiscal-key-not-used-in-prod-000000
      ENVIRONMENT: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Advisory (non bloquant) : les CVE de dépendances tierces ne doivent pas
      # geler les déploiements (sinon toute nouvelle CVE bloque la prod). Les
      # findings restent visibles dans les logs ; à traiter via une PR de
      # maintenance dédiée (bump deps).
      - name: Dependency audit (advisory)
        continue-on-error: true
        run: python -m pip_audit --skip-editable

      - name: Lint (ruff)
        run: python -m ruff check . --output-format=github

      - name: Alembic migrations
        working-directory: ${{ github.workspace }}
        run: |
          python scripts/bootstrap_database.py --confirm-empty
          cd apps/api
          python -m alembic upgrade head
          # Drift-proof : la base doit être exactement au head Alembic (pas de
          # numéro codé en dur — sinon chaque migration casse la CI).
          CUR=$(python -m alembic current | awk '{print $1}')
          HEAD=$(python -m alembic heads | awk '{print $1}')
          echo "alembic current=$CUR head=$HEAD"
          test "$CUR" = "$HEAD"

      - name: Tests
        # Les tests applicatifs sont conçus pour SQLite (types portables, cf.
        # CLAUDE.md) : conftest recrée le schéma par test via create_all/drop_all.
        # Les faire tourner sur la MÊME base PostgreSQL que le step Alembic
        # ci-dessus provoque des collisions (« relation ... already exists »)
        # avec le schéma déjà migré. Le step Alembic valide déjà les migrations
        # sur PostgreSQL ; ce step-ci valide la logique applicative sur SQLite.
        env:
          DATABASE_URL: sqlite+aiosqlite:////tmp/vintiz_citest.db
        run: |
          rm -f /tmp/vintiz_citest.db
          python -m pytest tests/ -v --tb=short

  # -------------------------------------------------------
  # Sanity — fast pre-flight check on TS/JSX imports
  #
  # Catches the specific class of bugs introduced by automated rewriters
  # (Sprint 3 broke prod once via a multi-line import injection — see
  # PR #49). Runs in milliseconds, fails fast with a clear file:line
  # pointer before we even spin up Node.
  # -------------------------------------------------------
  imports:
    name: TS imports sanity
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify TS/JSX imports
        run: python3 scripts/verify_imports.py apps/web/src apps/site/src

  # -------------------------------------------------------
  # Admin UI (apps/web)
  # -------------------------------------------------------
  web:
    name: Web Admin (Next.js)
    runs-on: ubuntu-latest
    needs: [imports]
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Advisory (non bloquant) — voir la note du job API.
      - name: Dependency audit (advisory)
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.vintiz.fr

  # -------------------------------------------------------
  # Site vitrine (apps/site)
  # -------------------------------------------------------
  site:
    name: Site Vitrine (Next.js)
    runs-on: ubuntu-latest
    needs: [imports]
    defaults:
      run:
        working-directory: apps/site

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/site/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Advisory (non bloquant) — voir la note du job API.
      - name: Dependency audit (advisory)
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.vintiz.fr
          NEXT_PUBLIC_SITE_URL: https://vintiz.fr

  # -------------------------------------------------------
  # Docker build — verifie que les images compilent
  #
  # Runs on PRs too (was main-only). The hotfix retro-mortem on PR #49
  # showed that a build that passes locally + the Node-only ``web`` job
  # can still fail inside the Docker context (different layer ordering,
  # build args, cache state). Catching it before merge avoids deploy
  # rollbacks. With GHA cache the second run on a PR takes ~2-3 min.
  # -------------------------------------------------------
  docker:
    name: Docker build check
    runs-on: ubuntu-latest
    needs: [api, web, site]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.api
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.web
          push: false
          build-args: NEXT_PUBLIC_API_URL=https://api.vintiz.fr
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Site image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.site
          push: false
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.vintiz.fr
            NEXT_PUBLIC_SITE_URL=https://vintiz.fr
          cache-from: type=gha
          cache-to: type=gha,mode=max
