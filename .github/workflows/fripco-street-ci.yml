# CI de l'application isolée fripco-street tant qu'elle vit dans ce dépôt
# (dossier fripco-street/). Miroir de fripco-street/.github/workflows/ci.yml ;
# à supprimer ici lors du transfert vers le dépôt dédié.
name: fripco-street CI

on:
  push:
    branches: [main]
    paths: ["fripco-street/**", ".github/workflows/fripco-street-ci.yml"]
  pull_request:
    branches: [main]
    paths: ["fripco-street/**", ".github/workflows/fripco-street-ci.yml"]

jobs:
  api:
    name: fripco-street API (Python, PostgreSQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fripco-street/apps/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fripco
          POSTGRES_PASSWORD: fripco
          POSTGRES_DB: fripco_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://fripco:fripco@localhost:5432/fripco_test
      DATABASE_URL: postgresql+asyncpg://fripco:fripco@localhost:5432/fripco_test
      SECRET_KEY: ci-secret-key-not-used-in-prod-00000000
      FISCAL_SIGNING_KEY: ci-fiscal-key-not-used-in-prod-000000
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: fripco-street/apps/api/pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint (ruff)
        run: python -m ruff check . --output-format=github
      - name: Migrations Alembic (base vide → head)
        run: |
          python -m alembic upgrade head
          CUR=$(python -m alembic current | awk '{print $1}')
          HEAD=$(python -m alembic heads | awk '{print $1}')
          test "$CUR" = "$HEAD"
      - name: Tests (PostgreSQL)
        run: python -m pytest tests/ -v --tb=short

  web:
    name: fripco-street Web (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fripco-street/apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fripco-street/apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ""

  docker:
    name: fripco-street Docker build check
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: fripco-street
          file: fripco-street/docker/Dockerfile.api
          push: false
      - uses: docker/build-push-action@v5
        with:
          context: fripco-street
          file: fripco-street/docker/Dockerfile.web
          push: false
          build-args: NEXT_PUBLIC_API_URL=
