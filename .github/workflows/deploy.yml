name: Deploy Production

on:
  # Déploiement automatique uniquement après succès du workflow CI sur main.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  # Deploiement manuel depuis l'onglet Actions
  workflow_dispatch:
    inputs:
      first_run:
        description: "Base entièrement vide à initialiser (sans seed) ?"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

# Un seul deploiement a la fois
concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    environment: production

    steps:
      # Garde-fou : un secret SSH absent est une ERREUR, pas un succes.
      # L'ancien comportement (warning + run vert sans deployer) a masque un
      # mois de non-deploiement en aout 2026 : la prod restait sur le build du
      # 28/07 alors que chaque run "Deploy Production" affichait succes.
      # Incident : PR #183 mergee, run vert, prod toujours en 1.1.5/0075.
      - name: Verifier la configuration du deploiement
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          if [ -z "${VPS_HOST}" ]; then
            echo "::error title=Deploiement impossible::Secret VPS_HOST absent \
            (Settings > Secrets and variables > Actions, ou environnement 'production'). \
            La prod n'est PAS deployee. Restaurer VPS_HOST / VPS_USER / VPS_SSH_KEY \
            (VPS_PORT optionnel) puis relancer, ou deployer manuellement : \
            cd /opt/vintiz && git pull origin main && ./scripts/deploy.sh"
            exit 1
          fi

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -euo pipefail
            cd /opt/vintiz

            # Choisir le flag --first-run si demande manuellement
            EXTRA_FLAG=""
            if [ "${{ github.event.inputs.first_run }}" = "true" ]; then
              EXTRA_FLAG="--first-run"
            fi

            ./scripts/deploy.sh $EXTRA_FLAG

# -------------------------------------------------------
# Secrets GitHub requis (Settings > Secrets > Actions):
#   VPS_HOST      IP ou domaine du serveur (ex: 51.12.34.56)
#   VPS_USER      Utilisateur SSH (ex: ubuntu, root)
#   VPS_SSH_KEY   Cle privee SSH (contenu complet, ex: -----BEGIN OPENSSH PRIVATE KEY-----)
#   VPS_PORT      Port SSH (optionnel, defaut 22)
#
# Sur le serveur, ajouter la cle publique dans ~/.ssh/authorized_keys
# Cloner le repo : git clone https://github.com/juliengonde-5g/vintiz /opt/vintiz
# Configurer .env : cp /opt/vintiz/.env.production.template /opt/vintiz/.env && nano /opt/vintiz/.env
# -------------------------------------------------------
