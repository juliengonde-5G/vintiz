name: Android — lint + unit tests + APK debug

on:
  push:
    branches:
      - main
      - 'claude/**'
    paths:
      - 'apps/android/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'apps/android/**'
      - '.github/workflows/android.yml'
  # Permet de re-builder à la demande depuis l'onglet Actions GitHub
  # sans pousser un nouveau commit.
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    defaults:
      run:
        working-directory: apps/android

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/android/**/*.gradle.kts', 'apps/android/gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Generate Gradle wrapper if missing
        run: |
          if [ ! -f gradlew ]; then
            echo "Wrapper absent — génération dans un projet stub..."
            # On évite que `gradle wrapper` évalue notre projet (AGP 8.7
            # ne supporte pas Gradle 9.x installé sur le runner). On
            # génère le wrapper depuis un mini projet stub puis on copie
            # les fichiers en place.
            TMP=$(mktemp -d)
            touch "$TMP/settings.gradle.kts"
            (cd "$TMP" && gradle wrapper --gradle-version 8.11.1 --distribution-type bin)
            cp "$TMP/gradlew" "$TMP/gradlew.bat" .
            mkdir -p gradle/wrapper
            cp "$TMP/gradle/wrapper/gradle-wrapper.jar" gradle/wrapper/
            cp "$TMP/gradle/wrapper/gradle-wrapper.properties" gradle/wrapper/
          fi
          chmod +x gradlew
          ./gradlew --version

      - name: Unit tests (POS — modules existants)
        run: |
          ./gradlew \
            :core:core-common:test \
            :core:core-network:testDebugUnitTest \
            :hardware:hardware-api:test \
            :hardware:hardware-escpos-tcp:testDebugUnitTest \
            :hardware:hardware-zpl-tcp:testDebugUnitTest \
            :hardware:hardware-sumup-rest:testDebugUnitTest \
            :domain:domain-pos:test \
            :domain:domain-inventory:test \
            :domain:domain-cahier:test \
            :domain:domain-reports:test \
            :domain:domain-zones:test \
            :data:data-auth:testDebugUnitTest \
            :data:data-loyalty:testDebugUnitTest \
            :feature:feature-fiscal:testDebugUnitTest \
            :feature:feature-loyalty:testDebugUnitTest

      - name: Unit tests (Client — Sprint A)
        run: |
          ./gradlew \
            :data:data-auth-client:testDebugUnitTest

      - name: Android Lint POS (dev debug)
        run: |
          set +e
          ./gradlew :app-pos:lintDevDebug --stacktrace --info > lint-pos.log 2>&1
          EXIT=$?
          set -e
          echo "=== LAST 250 LINES OF LINT POS LOG ==="
          tail -250 lint-pos.log
          echo "=== END OF LINT POS LOG ==="
          if [ -f app-pos/build/reports/lint-results-devDebug.txt ]; then
            echo "=== LINT TEXT REPORT ==="
            cat app-pos/build/reports/lint-results-devDebug.txt
            echo "=== END LINT TEXT REPORT ==="
          fi
          exit $EXIT

      - name: Android Lint Client (dev debug)
        run: |
          set +e
          ./gradlew :app-client:lintDevDebug --stacktrace --info > lint-client.log 2>&1
          EXIT=$?
          set -e
          echo "=== LAST 250 LINES OF LINT CLIENT LOG ==="
          tail -250 lint-client.log
          echo "=== END OF LINT CLIENT LOG ==="
          if [ -f app-client/build/reports/lint-results-devDebug.txt ]; then
            echo "=== LINT TEXT REPORT ==="
            cat app-client/build/reports/lint-results-devDebug.txt
            echo "=== END LINT TEXT REPORT ==="
          fi
          exit $EXIT

      - name: Build APK debug POS (dev flavor)
        run: ./gradlew :app-pos:assembleDevDebug --stacktrace

      - name: Build APK debug Client (dev flavor)
        run: ./gradlew :app-client:assembleDevDebug --stacktrace

      - name: Rename APK avec SHA court
        run: |
          SHA=${GITHUB_SHA::7}
          mkdir -p artifacts
          cp app-pos/build/outputs/apk/dev/debug/app-pos-dev-debug.apk \
             "artifacts/vintiz-pos-dev-${SHA}.apk"
          cp app-client/build/outputs/apk/dev/debug/app-client-dev-debug.apk \
             "artifacts/vintiz-client-dev-${SHA}.apk"
          ls -la artifacts/

      - name: Upload APKs debug en artifact
        uses: actions/upload-artifact@v4
        with:
          name: vintiz-apks-dev-debug-${{ github.sha }}
          path: apps/android/artifacts/*.apk
          retention-days: 30
          # Téléchargeable depuis :
          # https://github.com/juliengonde-5G/vintiz/actions/runs/<run_id>
          # Onglet "Summary" → section "Artifacts" en bas.

      - name: Upload test reports si échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.sha }}
          path: |
            apps/android/**/build/reports/tests/
            apps/android/**/build/reports/lint-results-*.html
            apps/android/**/build/reports/lint-results-*.xml
            apps/android/**/build/reports/lint-results-*.txt
            apps/android/**/build/test-results/
            apps/android/lint-pos.log
            apps/android/lint-client.log
          retention-days: 7
          if-no-files-found: ignore
