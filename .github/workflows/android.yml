name: Android — lint + unit tests

on:
  push:
    branches: [main]
    paths:
      - 'apps/android/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'apps/android/**'
      - '.github/workflows/android.yml'

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: apps/android

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/android/**/*.gradle.kts', 'apps/android/gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Check Gradle wrapper exists
        id: wrapper
        run: |
          if [ -f gradlew ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            chmod +x gradlew
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Gradle wrapper missing. Run 'gradle wrapper --gradle-version 8.11.1' locally and commit the result."
          fi

      - name: Unit tests + lint
        if: steps.wrapper.outputs.present == 'true'
        run: |
          ./gradlew \
            :core:core-common:test \
            :core:core-network:testDebugUnitTest \
            :hardware:hardware-api:test \
            :hardware:hardware-escpos-tcp:test \
            :hardware:hardware-zpl-tcp:test
          ./gradlew :app:lintDevDebug

      - name: Skip notice
        if: steps.wrapper.outputs.present == 'false'
        run: |
          echo "Gradle wrapper not committed yet — skipping build for Sprint 0 bootstrap PR."
          echo "Generate locally with: cd apps/android && gradle wrapper --gradle-version 8.11.1"
