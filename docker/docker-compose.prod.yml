name: vintiz

services:
  caddy:
    image: caddy:2-alpine
    container_name: vintiz-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../docker/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - web
      - site
      - matomo
    networks:
      - vintiz-network
      # Réseau EXTERNE de la caisse Frip & Co Street (stack séparée). Caddy
      # y est rattaché uniquement pour proxifier app.lloomi.fr ; aucun
      # autre service Vintiz ne le rejoint. Créé par scripts/deploy.sh.
      - fripco-network

  db:
    # Drop-in PG 16 image with pgvector pre-installed (P1-004 / P2-003).
    # Compatible binary-wise with the existing postgres:16-alpine data
    # directory — switching only requires a container restart.
    image: pgvector/pgvector:pg16
    container_name: vintiz-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vintiz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - vintiz-network

  redis:
    image: redis:7-alpine
    container_name: vintiz-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vintiz-network

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
      args:
        # Renseignés par scripts/deploy.sh (export avant le build). Exposés
        # par GET /api/health pour tracer la version réellement déployée.
        VINTIZ_BUILD_SHA: ${VINTIZ_BUILD_SHA:-unknown}
        VINTIZ_BUILD_DATE: ${VINTIZ_BUILD_DATE:-unknown}
    container_name: vintiz-api
    restart: unless-stopped
    env_file:
      - ../.env
    # This compose file is production-only. Force the runtime mode so a legacy
    # .env containing APP_ENV (ignored by Pydantic) can never silently boot the
    # API with development fallbacks for JWT or fiscal signing.
    environment:
      ENVIRONMENT: production
    # Persisted on disk, outside the ephemeral container layer so a redeploy
    # (deploy.sh rebuilds the image) doesn't wipe them:
    #   - /app/uploads : product photos
    #   - /app/data    : runtime settings (Brevo/SMTP keys via /settings >
    #     Communication, hardware config) → app_config.json + hardware.json
    volumes:
      - uploads_data:/app/uploads
      - vintiz_data:/app/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - vintiz-network

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
      args:
        - NEXT_PUBLIC_API_URL=https://api.vintiz.fr
    container_name: vintiz-web
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=https://api.vintiz.fr
    networks:
      - vintiz-network

  site:
    build:
      context: ..
      dockerfile: docker/Dockerfile.site
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://api.vintiz.fr}
        - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-https://vintiz.fr}
        - NEXT_PUBLIC_GA_ID=${NEXT_PUBLIC_GA_ID:-}
        - NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION=${NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION:-}
        # NEXT_PUBLIC_* est inliné au BUILD → doit être présent en build arg.
        - NEXT_PUBLIC_MATOMO_URL=${NEXT_PUBLIC_MATOMO_URL:-}
        - NEXT_PUBLIC_MATOMO_SITE_ID=${NEXT_PUBLIC_MATOMO_SITE_ID:-}
    container_name: vintiz-site
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-https://vintiz.fr}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://api.vintiz.fr}
      - NEXT_PUBLIC_GA_ID=${NEXT_PUBLIC_GA_ID:-}
      - NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION=${NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION:-}
      - NEXT_PUBLIC_MATOMO_URL=${NEXT_PUBLIC_MATOMO_URL:-}
      - NEXT_PUBLIC_MATOMO_SITE_ID=${NEXT_PUBLIC_MATOMO_SITE_ID:-}
    networks:
      - vintiz-network

  # --- Mesure d'audience Matomo (cookieless, exemptée CNIL) ---------------
  # Base dédiée à Matomo (MariaDB) — SÉPARÉE de la base applicative Postgres.
  matomo-db:
    image: mariadb:11
    container_name: vintiz-matomo-db
    restart: unless-stopped
    command: --max-allowed-packet=64MB
    environment:
      MYSQL_ROOT_PASSWORD: ${MATOMO_DB_ROOT_PASSWORD}
      MYSQL_DATABASE: matomo
      MYSQL_USER: matomo
      MYSQL_PASSWORD: ${MATOMO_DB_PASSWORD}
    volumes:
      - matomo_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vintiz-network

  matomo:
    image: matomo:5-apache
    container_name: vintiz-matomo
    restart: unless-stopped
    environment:
      MATOMO_DATABASE_HOST: matomo-db
      MATOMO_DATABASE_ADAPTER: mysql
      MATOMO_DATABASE_TABLES_PREFIX: matomo_
      MATOMO_DATABASE_USERNAME: matomo
      MATOMO_DATABASE_PASSWORD: ${MATOMO_DB_PASSWORD}
      MATOMO_DATABASE_DBNAME: matomo
    volumes:
      - matomo_app:/var/www/html
    depends_on:
      matomo-db:
        condition: service_healthy
    networks:
      - vintiz-network

networks:
  vintiz-network:
    driver: bridge
  fripco-network:
    external: true

# Volumes externes — avant l'ajout de `name: vintiz` ci-dessus (PR #189), le
# nom du projet Compose était dérivé du dossier `docker/`, donc Docker a créé
# ces volumes sous le préfixe `docker_` (ex. `docker_postgres_data`). Ils
# contiennent les données de prod existantes (base, uploads, certificats TLS,
# Matomo) : on les déclare `external: true` pour que la nouvelle stack les
# réutilise au lieu d'en créer des vides sous le préfixe `vintiz_`. Si le nom
# ne correspond pas, `docker compose up` échoue proprement avec
# « volume ... not found » plutôt que de démarrer silencieusement à vide.
volumes:
  postgres_data:
    external: true
    name: docker_postgres_data
  redis_data:
    external: true
    name: docker_redis_data
  caddy_data:
    external: true
    name: docker_caddy_data
  caddy_config:
    external: true
    name: docker_caddy_config
  uploads_data:
    external: true
    name: docker_uploads_data
  vintiz_data:
    external: true
    name: docker_vintiz_data
  matomo_db_data:
    external: true
    name: docker_matomo_db_data
  matomo_app:
    external: true
    name: docker_matomo_app
