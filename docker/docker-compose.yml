version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: vintiz-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vintiz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vintiz_dev_2026}
      POSTGRES_DB: ${POSTGRES_DB:-vintiz}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vintiz}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vintiz-network

  redis:
    image: redis:7-alpine
    container_name: vintiz-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vintiz-network

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: vintiz-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    volumes:
      - ../apps/api:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - vintiz-network

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    container_name: vintiz-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://api:8000
    depends_on:
      - api
    networks:
      - vintiz-network

  site:
    build:
      context: ..
      dockerfile: docker/Dockerfile.site
    container_name: vintiz-site
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NEXT_PUBLIC_SITE_URL=http://localhost:3001
    networks:
      - vintiz-network

networks:
  vintiz-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
